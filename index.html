let quiz={};
function begin(a,b){let n=20;let pool=WORDS.filter(w=>w.id>=a&&w.id<=b);quiz={mode:"normal",pool:shuffle(pool).slice(0,Math.min(n,pool.length)),i:0,answers:[],wrong:[]};renderQuiz()}

function renderQuiz(){let w=quiz.pool[quiz.i], opts=makeOptions(w);document.getElementById("app").innerHTML=`<div class="progress"><i style="width:${quiz.i/quiz.pool.length*100}%"></i></div><main class="quiz">

function makeOptions(w){let others=shuffle(WORDS.filter(x=>x.id!==w.id)).slice(0,3);return shuffle([w,...others])}
function answer(id,wid,j){let btns=[...document.querySelectorAll(".answer")];btns.forEach(b=>b.disabled=true);let chosen=WORDS.find(w=>w.id===id), target=WORDS.find(w=>w.id===wid), ok=id===wid;btns[j].classList.add(ok?"correct":"wrong");if(!ok){let correctIndex=btns.findIndex(b=>b.querySelector("span").textContent===target.meaning);if(correctIndex>=0)btns[correctIndex].classList.add("correct");quiz.wrong.push(target)}quiz.answers.push(ok);updateWord(wid,ok);setTimeout(()=>{quiz.i++;quiz.i<quiz.pool.length?renderQuiz():finishQuiz()},260)}
function updateWord(id,ok){let h=state.history[id]||{a:0,c:0,w:0,streak:0,wrongStreak:0,lastCorrect:null,lastWrong:null};h.a++;ok?h.c++:h.w++;ok?(h.streak++,h.wrongStreak=0,h.lastCorrect=Date.now()):(h.streak=0,h.wrongStreak++,h.lastWrong=Date.now());state.history[id]=h;if(h.a>=3&&score(id)<30&&!state.stats.mastered.includes(id))state.stats.mastered.push(id);schedule(id,ok);save()}
function score(id){let h=state.history[id];if(!h||!h.a)return 0;let recent=Math.min(h.a,10), recentCorrect=h.c; // approximated with overall until detailed rolling history is added
let recentRate=recent?Math.max(0,Math.min(1,recentCorrect/recent)):0;
let overall=h.c/h.a;let streakPenalty=Math.min(1,h.wrongStreak/3);let days=h.lastCorrect?Math.min(1,(Date.now()-h.lastCorrect)/(30*86400000)):1;
return Math.round((1-recentRate)*40+(1-overall)*25+streakPenalty*20+days*15)}
function schedule(id,ok){let arr=state.review.filter(r=>r.id!==id);if(ok){let old=state.review.find(r=>r.id===id);if(old){let idx=old.stage||0;if(idx<4){let delays=[1,3,7,30];arr.push({id,stage:idx+1,next:Date.now()+delays[idx]*86400000})}}}else arr.push({id,stage:1,next:Date.now()+86400000});state.review=arr}

function stats(){let acc=state.stats.questions?Math.round(state.stats.correct/state.stats.questions*100):0;document.getElementById("app").innerHTML=header()+`<main class="screen"><div class="hero"><h1>STATISTICS</h1><p>学習状況を分析</p></div><div class="statrow"><div class="stat"><span class="muted">ACCURACY</span><strong>${acc}%</strong></div><div class="stat"><span class="muted">MASTERED</span><strong>${state.stats.mastered.length}</strong></div><div class="stat"><span class="muted">STUDY DAYS</span><strong>${state.days.length}</strong></div><div class="stat"><span class="muted">TESTS</span><strong>${state.stats.tests}</strong></div></div><div class="sectiontitle">LEVELS</div>${["Basic","Standard","Master"].map(l=>{let max=l==="Basic"?100:l==="Standard"?400:WORDS.length;let qs=WORDS.filter(w=>w.id<=max);let a=qs.reduce((s,w)=>s+(state.history[w.id]?.a||0),0),c=qs.reduce((s,w)=>s+(state.history[w.id]?.c||0),0);return `<div class="card"><div class="top"><b>${l}</b><span>${a?Math.round(c/a*100):0}%</span></div><div class="muted">${a} answers · ${qs.length} words</div></div>`}).join("")}</main>${nav("stats")}`}

["🔥","10 DAYS",state.streak>=10],["🔥","30 DAYS",state.streak>=30],["💯","100 WORDS",state.stats.mastered.length>=100],["💯","200 WORDS",state.stats.mastered.length>=200],["📚","PERFECT",false],["👑","MASTER",state.stats.mastered.length>=WORDS.length]
];document.getElementById("app").innerHTML=header()+`<main class="screen"><div class="hero"><h1>ACHIEVEMENTS</h1><p>集めたバッジ</p></div><div class="grid2">${ach.map(a=>`<div class="card" style="text-align:center;opacity:${a[2]?1:.38};min-height:135px"><div style="font-size:42px">${a[0]}</div><b>${a[1]}</b><div class="muted" style="margin-top:8px">${a[2]?"✓ UNLOCKED":"🔒 LOCKED"}</div></div>`).join("")}</div></main>${nav("home")}`}
function settings(){document.getElementById("app").innerHTML=header()+`<main class="screen"><div class="hero"><h1>SETTING</h1><p>自分の学習環境を調整</p></div><div class="card"><div class="top"><b>🔔 REVIEW NOTIFICATION</b><button class="chip ${state.settings.notify?"on":""}" onclick="toggleNotify()">${state.settings.notify?"ON":"OFF"}</button></div><p class="muted">復習日の通知を受け取る設定。ブラウザ版では通知権限が必要です。</p><label class="muted">通知時刻</label><input id="notifyTime" type="time" value="${state.settings.time}" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;background:#0b1623;color:white;border:1px solid #1d3852" onchange="state.settings.time=this.value;save()"></div><div class="card"><b>🔊 PRONUNCIATION</b><p class="muted">英単語の発音は端末の音声機能を利用します。</p></div><div class="card"><b>DATA</b><p class="muted">学習データはこの端末のブラウザに保存されます。</p><button class="secondary" onclick="if(confirm('学習データをすべて削除しますか？')){localStorage.removeItem(KEY);location.reload()}">RESET DATA</button></div></main>${nav("settings")}`}
function toggleNotify(){state.settings.notify=!state.settings.notify;save();settings()}
