*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:radial-gradient(circle at 50% -10%,#18365a 0,#07111f 45%);color:var(--text)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;overflow:auto;padding:22px 18px 100px;overscroll-behavior:contain;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.08em;font-size:19px}.brand span{color:var(--accent)}
.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:#0b1a2b;border-radius:14px}
.hero{padding:18px 4px 20px}.hero h1{margin:0;font-size:31px;letter-spacing:.03em}.hero p{margin:6px 0;color:var(--muted);font-size:12px;letter-spacing:.16em}
.card{background:linear-gradient(145deg,#10243a,#0c192a);border:1px solid var(--line);border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 10px 30px #0003}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{padding:18px 8px;border-radius:18px;background:#0d1b2e;border:1px solid var(--line);text-align:center}.level b{display:block;font-size:17px}.level small{color:var(--muted)}
.rangeWrap{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity}.rangeWrap::-webkit-scrollbar{display:none}
.range{min-width:128px;scroll-snap-align:start;text-align:left;padding:16px}.range b{font-size:17px}.range small{display:block;color:var(--muted);margin-top:5px}.range.selected{border-color:var(--accent);box-shadow:0 0 0 1px #42d9ff44,0 8px 25px #0004}
.primary{width:100%;padding:16px;border-radius:16px;background:linear-gradient(100deg,var(--accent2),var(--accent));color:#04111e;font-weight:900;margin-top:8px}.secondary{padding:12px 16px;border-radius:14px;background:#132b45;border:1px solid var(--line);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:24px}.stat small{display:block;color:var(--muted);margin-top:4px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:76px;background:#07111fee;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav{background:none;color:var(--muted);font-size:11px}.nav.active{color:var(--accent)}.nav div{font-size:21px;margin-bottom:2px}
.test{height:100%;display:flex;flex-direction:column;padding:18px}.progress{height:7px;background:#18314b;border-radius:99px;overflow:hidden;margin:8px 0 24px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .25s}
.word{text-align:center;padding:25px 5px 20px}.word small{color:var(--muted)}.word h1{font-size:42px;margin:10px 0 5px;letter-spacing:.02em}.speak{background:#132b45;border:1px solid var(--line);border-radius:50%;width:48px;height:48px;font-size:20px}
.choices{display:grid;gap:12px;margin-top:auto;margin-bottom:15px}.choice{min-height:62px;border-radius:17px;background:#10243a;border:1px solid var(--line);text-align:left;padding:14px 16px;font-weight:700}.choice.correct{border-color:var(--good);background:#123d2a}.choice.wrong{border-color:var(--bad);background:#421e2a}.choice:disabled{opacity:.95}
.result{text-align:center}.grade{font-size:54px;font-weight:1000;margin:5px}.listrow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10243a;border:1px solid var(--line);padding:12px 16px;border-radius:14px;z-index:50;display:none;white-space:nowrap}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#17304a;color:var(--accent);font-size:11px;font-weight:800}
</style>
</head>

const KEY="vocabMasterStateV2";
const DEFAULT={stats:{correct:0,total:0,days:[],streak:0,lastDay:"",perfect:{}}, words:{}, mistakes:[], review:[]};
let state=load(), level="Basic", range=[1,100], session=[], pos=0, sessionWrong=[], answerLocked=false;

function load(){try{return Object.assign(structuredClone(DEFAULT),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function word(id){return WORDS[id-1]}
function ensure(id){if(!state.words[id])state.words[id]={correct:0,total:0,streakWrong:0,lastCorrect:null,nextReview:null};return state.words[id]}
function speak(w){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function grade(p){return p>=90?"S":p>=80?"A":p>=70?"B":p>=60?"C":"D"}
function levelMax(){return level==="Basic"?100:level==="Standard"?400:2000}
function ranges(){let a=[];for(let i=1;i<=levelMax();i+=100)a.push([i,Math.min(i+99,levelMax())]);return a}
function nav(active){return `<div class="bottom">
<button class="nav ${active==="home"?"active":""}" onclick="home()"><div>⌂</div>ホーム</button>
<button class="nav ${active==="test"?"active":""}" onclick="select()"><div>▶</div>テスト</button>
<button class="nav ${active==="weak"?"active":""}" onclick="weak()"><div>♢</div>苦手</button>
<button class="nav ${active==="stats"?"active":""}" onclick="stats()"><div>◎</div>記録</button></div>`}
function shell(title,body,active="home"){return `<div class="screen"><div class="top"><div class="brand">VOCAB <span>MASTER</span></div><button class="iconbtn" onclick="settings()">⚙</button></div>${body}</div>${nav(active)}`}
function home(){
 let s=state.stats, acc=s.total?Math.round(s.correct/s.total*100):0;
 document.getElementById("app").innerHTML=shell("",`
 <div class="hero"><h1>今日も、1語ずつ。</h1><p>ENGLISH VOCABULARY TRAINING</p></div>
 <div class="card" onclick="weak()"><span class="badge">FOCUS</span><h2 style="margin:10px 0 4px">苦手単語テスト</h2><div class="muted">${weakIds().length}語があなたの苦手単語です</div></div>
 <div class="grid2"><div class="card stat"><small>連続学習</small><b>${s.streak}</b><small>日</small></div><div class="card stat"><small>全体正答率</small><b>${acc}%</b></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>レベルを選ぶ</b><span class="badge">2,000 WORDS</span></div>
 <div class="levels" style="margin-top:12px">
 <button class="level" onclick="level='Basic';select()"><b>Basic</b><small>1–100</small></button>
 <button class="level" onclick="level='Standard';select()"><b>Standard</b><small>1–400</small></button>
 <button class="level" onclick="level='Master';select()"><b>Master</b><small>1–2,000</small></button>
 </div></div>`);
}
function select(){
 let rs=ranges();
 document.getElementById("app").innerHTML=shell("",`
 <div class="hero"><h1>${level}</h1><p>SELECT RANGE</p></div>
 <div class="card"><b>出題範囲</b><div class="muted" style="margin:5px 0 12px">横にスクロールして選択できます</div>
 <div class="rangeWrap">${rs.map((r,i)=>`<button class="range ${r[0]===range[0]?"selected":""}" onclick="range=[${r[0]},${r[1]}];select()"><b>${r[0]}–${r[1]}</b><small>${r[1]-r[0]+1} WORDS</small></button>`).join("")}</div></div>
 <div class="card"><div style="display:flex;justify-content:space-between"><b>選択中</b><b>${range[0]}–${range[1]}</b></div><div class="muted" style="margin-top:5px">${range[1]-range[0]+1}語からランダム出題</div></div>
 <button class="primary" onclick="startTest()">テスト開始</button>`, "test");
}
function makeChoices(correctId, a,b){
 let ids=WORDS.slice(a-1,b).map(x=>x.id).filter(x=>x!==correctId);
 ids.sort(()=>Math.random()-.5); ids=ids.slice(0,3); ids.push(correctId); ids.sort(()=>Math.random()-.5);
 return ids;
}
function startTest(ids){
 let list=ids||WORDS.slice(range[0]-1,range[1]).map(x=>x.id);
 list.sort(()=>Math.random()-.5); session=list;pos=0;sessionWrong=[];answerLocked=false;showQuestion();
}
function showQuestion(){
 if(pos>=session.length){finish();return}
 let w=word(session[pos]), choices=makeChoices(w.id,range[0],range[1]);
 let pct=Math.round(pos/session.length*100);
 document.getElementById("app").innerHTML=`<div class="test">
 <div style="display:flex;justify-content:space-between"><b>${level}</b><span class="muted">${pos+1} / ${session.length}</span></div>
 <div class="progress"><i style="width:${pct}%"></i></div>
 <div class="word"><small>この単語の意味は？</small><h1>${htmlEsc(w.en)}</h1><button class="speak" onclick="speak(word(${w.id}).en)">🔊</button></div>
 <div class="choices">${choices.map(id=>`<button class="choice" id="c${id}" onclick="answer(${id},${w.id})">${htmlEsc(word(id).ja)}</button>`).join("")}</div>
 </div>`;
}
function answer(chosen,correct){
 if(answerLocked)return;answerLocked=true;
 let ok=chosen===correct, target=word(correct), d=ensure(correct);
 d.total++;state.stats.total++;
 let btn=document.getElementById("c"+chosen);btn.classList.add(ok?"correct":"wrong");
 if(ok){d.correct++;d.streakWrong=0;state.stats.correct++;scheduleReview(correct);updateDay();setTimeout(()=>{pos++;answerLocked=false;showQuestion()},420)}
 else{d.streakWrong++;state.mistakes.push({id:correct,date:today()});sessionWrong.push(correct);save();setTimeout(()=>{
   toast("不正解。もう一度この単語を出題します"); 
   session.splice(pos+1,0,correct);answerLocked=false;showQuestion();
 },650)}
 save();
}
function scheduleReview(id){let d=ensure(id), base=new Date();d.lastCorrect=today();d.nextReview=new Date(base.getTime()+86400000).toISOString().slice(0,10)}
function updateDay(){let t=today(),s=state.stats;if(s.lastDay!==t){let y=new Date();y.setDate(y.getDate()-1);let ys=y.toISOString().slice(0,10);s.streak=s.lastDay===ys?s.streak+1:1;s.lastDay=t;if(!s.days.includes(t))s.days.push(t)}}
function finish(){
 let total=session.length, wrong=new Set(sessionWrong), acc=Math.round((total-wrong.size)/total*100), g=grade(acc);
 document.getElementById("app").innerHTML=`<div class="screen"><div class="top"><div class="brand">RESULT</div><button class="iconbtn" onclick="home()">×</button></div>
 <div class="card result"><div class="grade">${g}</div><h2>${acc}%</h2><div class="muted">${total}語中 ${total-wrong.size}語正解</div></div>
 <div class="card"><b>間違えた単語</b>${wrong.size?Array.from(wrong).map(id=>`<div class="listrow"><span>${htmlEsc(word(id).en)}</span><span>${htmlEsc(word(id).ja)}</span></div>`).join(""):`<div class="empty">全問正解！</div>`}</div>
 <button class="primary" onclick="home()">ホームへ</button></div>`;save()
}
function weakIds(){
 return WORDS.map(w=>w.id).filter(id=>{let d=ensure(id);let recent=d.total?d.correct/d.total:1;let days=d.lastCorrect?Math.max(0,(Date.now()-new Date(d.lastCorrect).getTime())/86400000):30;let recentScore=Math.max(0,1-recent)*40;let totalScore=Math.max(0,1-(d.total?d.correct/d.total:1))*25;let streak=Math.min(d.streakWrong/3,1)*20;let period=Math.min(days/30,1)*15;return recentScore+totalScore+streak+period>=45})
}
function weakScore(id){let d=ensure(id),recent=d.total?d.correct/d.total:1,days=d.lastCorrect?Math.max(0,(Date.now()-new Date(d.lastCorrect).getTime())/86400000):30;return Math.round(Math.max(0,Math.min(100,(1-recent)*40+(1-(d.total?d.correct/d.total:1))*25+Math.min(d.streakWrong/3,1)*20+Math.min(days/30,1)*15)))}
function weak(){
 let ids=weakIds().sort((a,b)=>weakScore(b)-weakScore(a));
 document.getElementById("app").innerHTML=shell("",`<div class="hero"><h1>苦手単語</h1><p>WEAK WORDS / 0–100</p></div>
 <button class="primary" ${ids.length?"":"disabled"} onclick="startTest(${JSON.stringify(ids.slice(0,50))})">苦手単語をテスト　${ids.length}語</button>
 <div class="card">${ids.length?ids.slice(0,40).map(id=>`<div class="listrow"><span><b>${htmlEsc(word(id).en)}</b><br><small class="muted">${htmlEsc(word(id).ja)}</small></span><span class="badge">${weakScore(id)}</span></div>`).join(""):`<div class="empty">今は苦手単語がありません。</div>`}</div>`,"weak")
}
function stats(){
 let s=state.stats,acc=s.total?Math.round(s.correct/s.total*100):0,ach=[];
 if(s.streak>=10)ach.push("10日連続学習");if(s.streak>=30)ach.push("30日連続学習");
 for(let n=100;n<=2000;n+=100){let ok=WORDS.slice(n-100,n).every(w=>ensure(w.id).correct>0);if(ok)ach.push(`${n}単語習得`)}
 document.getElementById("app").innerHTML=shell("",`<div class="hero"><h1>記録</h1><p>YOUR PROGRESS</p></div>
 <div class="grid2"><div class="card stat"><small>正答率</small><b>${acc}%</b></div><div class="card stat"><small>回答数</small><b>${s.total}</b></div><div class="card stat"><small>連続日数</small><b>${s.streak}</b></div><div class="card stat"><small>習得単語</small><b>${WORDS.filter(w=>ensure(w.id).correct>0).length}</b></div></div>
 <div class="card"><b>実績</b>${ach.length?ach.map(x=>`<div class="listrow">🏆 ${x}</div>`).join(""):`<div class="empty">100単語習得や10日連続学習を目指そう。</div>`}</div>`,"stats")
}
function settings(){
 document.getElementById("app").innerHTML=shell("",`<div class="hero"><h1>設定</h1><p>SETTINGS</p></div>
 <div class="card"><b>復習通知</b><div class="muted" style="margin:7px 0 12px">ブラウザ通知の許可は端末側の設定にも依存します。</div><button class="secondary" onclick="notify()">通知を許可する</button></div>
 <div class="card"><b>学習ルール</b><div class="listrow"><span>復習間隔</span><span>1日 → 3日 → 7日 → 30日</span></div><div class="listrow"><span>苦手度</span><span>最近40% / 全体25% / 連続20% / 期間15%</span></div></div>
 <button class="secondary" onclick="home()">戻る</button>`)
}
function notify(){if("Notification"in window)Notification.requestPermission().then(x=>toast(x==="granted"?"通知を許可しました":"通知は許可されませんでした"))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.__t);window.__t=setTimeout(()=>x.style.display="none",1500)}
function htmlEsc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
document.addEventListener("contextmenu",e=>e.preventDefault());
